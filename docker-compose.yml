services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: doblador
      POSTGRES_PASSWORD: doblador_password
      POSTGRES_DB: doblador_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
