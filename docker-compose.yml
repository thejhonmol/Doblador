services:
  db:
    image: postgres:15.14-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:-doblador}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in orchestrator/.env}
      POSTGRES_DB: ${DB_NAME:-doblador_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in orchestrator/.env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in orchestrator/.env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  # Optional GPU container. The current native Windows workflow can keep running
  # python-services directly; enable this profile when the caller and this service
  # share container-visible paths under /work.
  python-ai:
    profiles: ["gpu"]
    build:
      context: ./python-services
      dockerfile: Dockerfile
    environment:
      PY_BIND_HOST: 0.0.0.0
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-whisper}
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:${PY_PORT:-8000}:8000"
    volumes:
      - hf_cache:/models/huggingface
      - ${DOBLADOR_WORKDIR:-./work}:/work
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)); assert d.get('status') == 'ok'"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # Local same-origin edge. It serves the ZhowPlus landing and proxies the native
  # Vite/Express processes so /, /app/ and /api/v1/ can be exercised through one
  # origin before production deployment.
  edge:
    profiles: ["edge"]
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ZHOWPLUS_LANDING_PATH:-../zhowplus}:/srv/zhowplus:ro
      - ./scripts/infra/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  hf_cache:
